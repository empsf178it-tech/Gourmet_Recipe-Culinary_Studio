  <path d="M 32 20 C 38 17, 42 21, 39 25 C 36 24, 34 22, 32 20 Z" fill="url(#gourmetGold)"/>
  
  <path d="M 32 26 C 25 24, 21 28, 24 32 C 27 31, 30 29, 32 26 Z" fill="url(#gourmetGold)"/>
  <path d="M 32 26 C 39 24, 43 28, 40 32 C 37 31, 34 29, 32 26 Z" fill="url(#gourmetGold)"/>
  
  <path d="M 32 32 C 24 31, 20 35, 23 39 C 26 38, 29 35, 32 32 Z" fill="url(#gourmetGold)"/>
  <path d="M 32 32 C 40 31, 44 35, 41 39 C 38 38, 35 35, 32 32 Z" fill="url(#gourmetGold)"/>

  <!-- Bakery Rolling Pin / Chef Ribbon Base -->
  <path d="M 20 42 C 26 40, 38 40, 44 42 C 46 44, 44 46, 42 46 L 22 46 C 20 46, 18 44, 20 42 Z" fill="url(#gourmetGold)"/>
  
  <!-- Crown Star -->
  <polygon points="32,9 33.5,13 37.5,13 34.2,15.5 35.5,19.5 32,17 28.5,19.5 29.8,15.5 26.5,13 30.5,13" fill="url(#gourmetGold)"/>
