      <stop offset="0%" stop-color="#F4EEE5"/>
      <stop offset="35%" stop-color="#DBA868"/>
      <stop offset="70%" stop-color="#C99A5B"/>
      <stop offset="100%" stop-color="#B86F45"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A211D"/>
      <stop offset="100%" stop-color="#171311"/>
    </radialGradient>
  </defs>
  <!-- Background Badge Base -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="url(#gourmetGold)" stroke-width="2"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#gourmetGold)" stroke-width="0.8" stroke-dasharray="2 2"/>
  
  <!-- Stylized Culinary Wheat Sheaf & Artisan Monogram Emblem -->
