<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Gourmet Recipe Studio</title>
  <meta name="description" content="Sign in to your Gourmet Recipe & Culinary Studio account to access saved recipes, masterclasses, and culinary progress tracking.">

  <!-- Google Fonts CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
</head>
<body class="gourmet-bg-primary">

  <main>
    <div class="auth-wrapper">
      <a href="index.html" class="auth-home-btn" aria-label="Back to Home">
        <i class="bi bi-arrow-left me-2"></i><span>Back to Home</span>
      </a>

      <div class="auth-card reveal-fade-up">
        <div class="text-center mb-4">
          <a href="index.html" class="d-inline-block text-decoration-none mb-3">
            <div class="brand-symbol mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;"><img src="assets/images/logo.svg" alt="Gourmet Studio emblem"></div>
            <div class="brand-text-wrap">
              <span class="brand-name" style="font-size: 1rem;">GOURMET</span>
              <span class="brand-sub" style="font-size: 0.55rem; letter-spacing: 0.15em;">RECIPE & CULINARY STUDIO</span>
            </div>
          </a>
          <h1 class="h3 text-white">Welcome Back</h1>
          <p class="small text-muted mb-0">Sign in to your demo culinary account</p>
        </div>

        <!-- Social Quick Login -->
        <div class="auth-social-buttons mb-4">
          <button type="button" class="btn-auth-social btn-auth-google" aria-label="Sign in with Google" onclick="processLogin('google.user@gourmetstudio.com')">
            <i class="bi bi-google"></i>
            <span>Google</span>
          </button>
          <button type="button" class="btn-auth-social btn-auth-apple" aria-label="Sign in with Apple" onclick="processLogin('apple.user@gourmetstudio.com')">
            <i class="bi bi-apple"></i>
            <span>Apple</span>
          </button>
          <button type="button" class="btn-auth-social btn-auth-facebook" aria-label="Sign in with Facebook" onclick="processLogin('facebook.user@gourmetstudio.com')">
            <i class="bi bi-facebook"></i>
            <span>Facebook</span>
          </button>
        </div>

        <div class="auth-divider mb-4">
          <span>OR SIGN IN WITH EMAIL</span>
        </div>

        <form id="gourmetLoginForm">
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" class="form-control-gourmet" placeholder="santhosh@gourmetstudio.com" value="santhosh@gourmetstudio.com" required>
          </div>

          <div class="form-group">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label mb-0" for="loginPassword">Password</label>
              <a href="#" class="small text-accent-gold" onclick="alert('Demo reset link sent to email!'); return false;">Forgot Password?</a>
            </div>
            <div class="password-input-wrap">
              <input type="password" id="loginPassword" class="form-control-gourmet" placeholder="••••••••" value="demo1234" required>
              <button type="button" class="btn-toggle-password" data-target="loginPassword" aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
            <label class="form-check-label small text-muted" for="rememberMe">Remember me on this browser</label>
          </div>

          <button type="submit" class="btn-gourmet-primary w-100 py-3 mb-3">Sign In <i class="bi bi-box-arrow-in-right ms-1"></i></button>
        </form>

        <div class="text-center pt-3 border-top border-secondary">
          <p class="small text-muted mb-0">Don't have a studio account yet? <a href="register.html" class="text-accent-gold fw-semibold ms-1">Create Account</a></p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
