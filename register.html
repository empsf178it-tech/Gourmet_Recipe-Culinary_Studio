<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Studio Account | Gourmet Recipe Studio</title>
  <meta name="description" content="Register for a Gourmet Recipe & Culinary Studio account to access member-only recipe formulas and masterclass progress.">

  <!-- Google Fonts CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
</head>
<body class="gourmet-bg-primary">

  <main>
    <div class="auth-wrapper">
      <a href="index.html" class="auth-home-btn" aria-label="Back to Home">
        <i class="bi bi-arrow-left me-2"></i><span>Back to Home</span>
      </a>

      <div class="auth-card reveal-fade-up" style="max-width: 500px;">
        <div class="text-center mb-4">
          <a href="index.html" class="d-inline-block text-decoration-none mb-3">
            <div class="brand-symbol mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;"><img src="assets/images/logo.svg" alt="Gourmet Studio emblem"></div>
            <div class="brand-text-wrap">
              <span class="brand-name" style="font-size: 1rem;">GOURMET</span>
              <span class="brand-sub" style="font-size: 0.55rem; letter-spacing: 0.15em;">RECIPE & CULINARY STUDIO</span>
            </div>
          </a>
          <h1 class="h3 text-white">Join the Studio</h1>
          <p class="small text-muted mb-0">Create your culinary student account</p>
        </div>

        <!-- Social Quick Register -->
        <div class="auth-social-buttons mb-4">
          <button type="button" class="btn-auth-social btn-auth-google" aria-label="Register with Google" onclick="processRegister('Google Member', 'google.user@gourmetstudio.com')">
            <i class="bi bi-google"></i>
            <span>Google</span>
          </button>
          <button type="button" class="btn-auth-social btn-auth-apple" aria-label="Register with Apple" onclick="processRegister('Apple Member', 'apple.user@gourmetstudio.com')">
            <i class="bi bi-apple"></i>
            <span>Apple</span>
          </button>
          <button type="button" class="btn-auth-social btn-auth-facebook" aria-label="Register with Facebook" onclick="processRegister('Facebook Member', 'facebook.user@gourmetstudio.com')">
            <i class="bi bi-facebook"></i>
            <span>Facebook</span>
          </button>
        </div>

        <div class="auth-divider mb-4">
          <span>OR REGISTER WITH EMAIL</span>
        </div>

        <form id="gourmetRegisterForm">
          <div class="form-group">
            <label class="form-label" for="regName">Full Name *</label>
            <input type="text" id="regName" class="form-control-gourmet" placeholder="Santhosh" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="regEmail">Email Address *</label>
            <input type="email" id="regEmail" class="form-control-gourmet" placeholder="santhosh@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="regPass">Password *</label>
            <div class="password-input-wrap">
              <input type="password" id="regPass" class="form-control-gourmet" placeholder="At least 8 characters" required>
              <button type="button" class="btn-toggle-password" data-target="regPass" aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <!-- Password Strength Indicator -->
            <div class="mt-2">
              <div class="d-flex justify-content-between align-items-center small text-muted">
                <span>Password Strength</span>
                <span class="text-accent-gold fw-semibold">Strong</span>
              </div>
              <div class="progress-bar-wrap">
                <div class="progress-bar-fill" data-width="85%" style="width: 85%;"></div>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="regPassConfirm">Confirm Password *</label>
            <div class="password-input-wrap">
              <input type="password" id="regPassConfirm" class="form-control-gourmet" placeholder="Repeat password" required>
              <button type="button" class="btn-toggle-password" data-target="regPassConfirm" aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="termsCheck" required>
            <label class="form-check-label small text-muted" for="termsCheck">
              I agree to the <a href="#" class="text-accent-gold" onclick="alert('Demo Terms & Conditions'); return false;">Terms of Service</a> & <a href="#" class="text-accent-gold" onclick="alert('Demo Privacy Policy'); return false;">Privacy Policy</a>.
            </label>
          </div>

          <button type="submit" class="btn-gourmet-primary w-100 py-3 mb-3">Create Studio Account <i class="bi bi-person-plus ms-1"></i></button>
        </form>

        <div class="text-center pt-3 border-top border-secondary">
          <p class="small text-muted mb-0">Already have an account? <a href="login.html" class="text-accent-gold fw-semibold ms-1">Sign In</a></p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
